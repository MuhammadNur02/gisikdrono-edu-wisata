# docs/Security.md SC-01: only sharp may run install scripts; new releases wait 7 days (in minutes).
onlyBuiltDependencies:
  - sharp
minimumReleaseAge: 10080

# next@15 pins postcss 8.4.31, which has two high advisories (GHSA-r28c-9q8g-f849 and the
# sourceMappingURL file read). Remove this once next ships a patched postcss.
overrides:
  next>postcss: ^8.5.18
  # @serwist/next 9.5.13 and its build packages pin zod 4.6.5 (GHSA-mrhx-c7xc-m3w5, fixed in 4.6.6); they take the
  # app's own zod instead. Remove these once Serwist ships a patched pin.
  '@serwist/next>zod': 4.6.7
  '@serwist/build>zod': 4.6.7
  '@serwist/webpack-plugin>zod': 4.6.7
