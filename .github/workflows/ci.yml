name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: check (lint, types, unit, db types)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:table-tests
      - run: pnpm check:doc-headings
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0
      - run: supabase db start
      - run: pnpm db:types:check

  db:
    name: db (pgTAP, integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0
      - name: Start Supabase and apply every migration
        run: supabase start
      - name: Development accounts and demo content (local stack only)
        run: pnpm db:seed
      - name: pgTAP
        # The first pgTAP files arrive with the P1.2 migrations; from then on this always runs.
        run: |
          if compgen -G "supabase/tests/*.sql" > /dev/null; then
            pnpm db:test
          else
            echo "No pgTAP files yet."
          fi
      - run: pnpm test:integration

  security:
    name: security (gitleaks, semgrep, audit, bundle secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner
      - name: semgrep
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
          semgrep scan --error
          --config p/nextjs --config p/typescript --config p/react
          --config p/owasp-top-ten --config p/secrets
          --config .semgrep/rules.yml
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - name: Sandbox env for the build
        # next build loads every route module to read its config, and the job and webhook routes
        # import the service-role client, which validates the server env on load. These are the
        # obviously fake values of tests/fixtures/env.ts that the unit tests use; nothing secret.
        run: >-
          pnpm exec tsx -e "import { sandboxEnv } from './tests/fixtures/env';
          for (const [name, value] of Object.entries(sandboxEnv)) console.log(name + '=' + value);"
          >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0
      - name: Local Supabase for the prerendered public pages
        id: stack
        # The public layout and pages read the database while next build prerenders them (ISR, Task
        # P2.3.02), as a Vercel build reads its own project. The migrations' reference data is enough.
        run: |
          supabase start
          echo "anon_key=$(supabase status -o json | jq -r .ANON_KEY)" >> "$GITHUB_OUTPUT"
      # The route table of the build is the first-load JS gate of CLAUDE.md §8 (Task P5.6.01). `shell: bash` is what
      # turns pipefail on (the default `run` shell has none), so a failed build fails the step despite tee.
      - run: pnpm build 2>&1 | tee build.log
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.stack.outputs.anon_key }}
      - name: First-load JS within budget
        run: node scripts/check-first-load-budget.mjs build.log
      - run: pnpm check:secrets

  e2e:
    name: e2e (booking, payment, QR, scanner changes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      # NEXT_PUBLIC_SUPABASE_ANON_KEY comes from the local stack, on the build step.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_WHATSAPP_CONTACT_NUMBER: '+6281200000000'
      # The Midtrans stand-in Playwright's global setup starts (tests/e2e/helpers/midtrans.ts): the sandbox keys here
      # are fake, so Snap and the Status API re-check are answered on this machine (decision of 2026-10-24, Q3).
      MIDTRANS_LOCAL_STUB_URL: http://127.0.0.1:4010
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Migrations, services and the money, QR and link libraries change what the booking flow does even when
      # no file name says booking, so they run the suite as well; so does a change to the suite itself, and to the
      # public UI and SEO code the accessibility and metadata specs guard (Tasks P5.6.02, P5.6.04).
      - name: Did booking, payment, QR, scanner, migration, service or e2e code change?
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -Eq 'booking|payment|qr|scanner|^supabase/migrations/|^src/server/services/|^src/lib/(pricing|qr|links|midtrans)/|^src/(app|components|config|styles)/|^src/lib/seo/|^tests/e2e/|^lighthouserc\.json$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.changed == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.scope.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.scope.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.changed == 'true'
        name: Sandbox server env for the build
        # The same obviously fake values the security job builds with (tests/fixtures/env.ts); the public
        # values stay as the job sets them above. The service-role key is the local stack's own instead (next
        # step): the sign-in limiter runs under it and fails closed, so a fake key would refuse every sign-in.
        run: >-
          pnpm exec tsx -e "import { sandboxEnv } from './tests/fixtures/env';
          for (const [name, value] of Object.entries(sandboxEnv))
          if (!name.startsWith('NEXT_PUBLIC_') && name !== 'SUPABASE_SERVICE_ROLE_KEY')
          console.log(name + '=' + value);"
          >> "$GITHUB_ENV"
      - if: steps.scope.outputs.changed == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0
      - if: steps.scope.outputs.changed == 'true'
        name: Local Supabase with the demo content
        id: stack
        # next build prerenders the public pages from the database, and the flows under test need the
        # demo packages and sessions of pnpm db:seed.
        run: |
          supabase start
          pnpm db:seed
          # Booking is closed on every database until the guest pages exist (20261023090000), and the build caches
          # the public settings, so the booking specs need it open before the build (tests/e2e/helpers/booking-flag.ts).
          pnpm exec tsx scripts/e2e-booking-flag.ts on
          echo "anon_key=$(supabase status -o json | jq -r .ANON_KEY)" >> "$GITHUB_OUTPUT"
          service_role_key="$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)"
          echo "::add-mask::$service_role_key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_ENV"
      - if: steps.scope.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.stack.outputs.anon_key }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm build
          pnpm e2e --pass-with-no-tests
      - if: failure() && steps.scope.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # The screenshots a spec takes on purpose for review (360 and 1280 px, light), synthetic data only.
      - if: always() && steps.scope.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      # Lighthouse on the served build (lighthouserc.json, Task P5.6.01): the runner's own Chrome, reports kept
      # as an artifact and never uploaded anywhere public. The first-load table is gated in the security job.
      - if: steps.scope.outputs.changed == 'true'
        name: Lighthouse budgets
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.stack.outputs.anon_key }}
        run: pnpm exec lhci autorun
      # The reports live in a dot folder, which upload-artifact skips unless told otherwise.
      - if: always() && steps.scope.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7
