name: Production release

# Task P5.7.02 (docs/runbooks/release-checklist.md; CLAUDE.md §6.4, §12.1 no. 19). Migrations are the only path into
# the gisikdrono-prod schema, and this job is the only one that pushes them. Until go-live it runs by hand only, from
# main only, and by default as a dry run that lists the migrations and changes nothing. The production credentials
# live in the GitHub environment "production", whose required reviewers approve every run before a step starts.
# The order of a release: check the project, run the pre-flight, migrate; the Vercel production deploy follows the
# migration (release checklist, "Then deploy"). Never --include-all or --include-seed.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only check the project, run the pre-flight and list the migrations that would run; change nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate the production database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # The name docs/Task.md P5.7.01 gives the project; any other project behind the URL is refused.
      PRODUCTION_PROJECT_NAME: gisikdrono-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0
      # The ref and the password come from SUPABASE_DB_URL itself (scripts/supabase-db-url.mjs), masked before any
      # later step sees them, so no second secret can point at another project.
      - name: Read the project of the database URL
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set in the GitHub environment 'production'"
            exit 1
          fi
          node scripts/supabase-db-url.mjs "$GITHUB_ENV" <<< "$SUPABASE_DB_URL"
      - name: The URL belongs to the production project
        run: |
          name="$(supabase projects list -o json \
            | jq -r --arg ref "$PROJECT_REF" '.[] | select(.id == $ref or .ref == $ref) | .name')"
          if [ "$name" != "$PRODUCTION_PROJECT_NAME" ]; then
            echo "::error::That URL is not the project $PRODUCTION_PROJECT_NAME; nothing was checked or migrated"
            exit 1
          fi
      - name: Link the production project
        run: supabase link --project-ref "$PROJECT_REF"
      # Read only, counts only: a row that a migration's new check would refuse stops the release here, before any
      # migration starts (release checklist, "The production release job's pre-flight").
      - name: Pre-flight
        run: supabase db query --linked --file scripts/release-preflight.sql > /dev/null
      - name: Migrations that would run
        run: supabase db push --linked --dry-run
      - name: Apply the migrations
        if: ${{ !inputs.dry_run }}
        run: supabase db push --linked --yes
      # docs/Security.md §8.7, DB-01: the Security Advisor shows no error after a release. Run on a dry run too, so
      # an error already there is seen before anything is pushed.
      - name: Security Advisor, errors only
        run: supabase db advisors --linked --type security --level error --fail-on error
