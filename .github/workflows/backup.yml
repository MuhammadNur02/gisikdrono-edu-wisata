name: Weekly database backup

# Task P5.5.04 (docs/Security.md §7.8, RES-01, DB-07; docs/runbooks/restore-drills.md): an encrypted copy of the
# production database lives outside Supabase, in a private Cloudflare R2 bucket. pg_dump --format=custom runs as the
# backup role (backup_reader, 20261104190700), never as postgres, and streams through age to BACKUP_AGE_PUBLIC_KEY, so
# no plain copy touches the runner's disk; only the vault holds the private key, and CI never decrypts. Before
# anything is dumped the job checks the URL's project against the pinned repository variable PRODUCTION_PROJECT_REF
# and the database's own Vault marker (internal.environment() = production); no access token is involved. The upload
# is read back and compared before the job passes. It runs only once PRODUCTION_BACKUP_ENABLED is 'true' (set at
# go-live); from then on a missing secret fails the run. The credentials live in the GitHub environment
# "production-backup" (main only, no reviewers, so the weekly run never waits), each handed to the step that needs it.
on:
  schedule:
    - cron: '0 19 * * 6' # Sunday 02:00 WIB
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: dump, encrypt, upload and verify
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-backup
    env:
      # Supabase's root certificate, a public file committed to the repository (restore-drills.md, part A): every
      # connection checks the server against it, never merely encrypts. The URL is the session pooler's (port 5432),
      # since GitHub's runners have no IPv6 to reach the direct host.
      PGSSLMODE: verify-full
      PGSSLROOTCERT: supabase/certs/prod-ca-2021.crt
      # The production database runs Postgres 17 (supabase/config.toml major_version).
      PG_BIN: /usr/lib/postgresql/17/bin
      ENCRYPTED_FILE: backup.dump.age
      VERIFY_FILE: verify.dump.age
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The URL belongs to the pinned production project
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
        run: |
          if [ ! -s "$PGSSLROOTCERT" ]; then
            echo "::error::$PGSSLROOTCERT is missing; commit Supabase's root certificate (restore-drills.md, part A)"
            exit 1
          fi
          if ! [[ "$PRODUCTION_PROJECT_REF" =~ ^[a-z]{20}$ ]]; then
            echo "::error::The repository variable PRODUCTION_PROJECT_REF is not a 20-letter project ref"
            exit 1
          fi
          node scripts/supabase-db-url.mjs "$GITHUB_ENV" --ref-only <<< "$SUPABASE_DB_URL"
      - name: The ref is the pinned one
        env:
          PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
        run: |
          if [ "$PROJECT_REF" != "$PRODUCTION_PROJECT_REF" ]; then
            echo "::error::SUPABASE_DB_URL is not the project PRODUCTION_PROJECT_REF names; nothing was dumped"
            exit 1
          fi
      - name: Install the Postgres 17 client and age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      # The database says which environment it is (the Vault secret of 0007), read through the one internal function
      # the backup role may call; the comparison happens in the database.
      - name: The database says it is production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          marker="$("$PG_BIN/psql" "$SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align \
            -c "select coalesce(internal.environment() = 'production', false)")"
          if [ "$marker" != "t" ]; then
            echo "::error::The database's Vault marker is not production; nothing was dumped"
            exit 1
          fi
      # Custom format, every schema, owners and grants left out. The sessions, tokens and MFA rows of auth are never
      # copied (review of PR #98, M1): after a real restore staff sign in again and enrol a new authenticator
      # (restore-drills.md, part E). An age X25519 recipient is age1 and 58 bech32 characters; a private key never fits.
      - name: Dump and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if ! [[ "$BACKUP_AGE_PUBLIC_KEY" =~ ^age1[02-9ac-hj-np-z]{58}$ ]]; then
            echo "::error::BACKUP_AGE_PUBLIC_KEY is not an age public key (age1...)"
            exit 1
          fi
          "$PG_BIN/pg_dump" --format=custom --no-owner --no-privileges \
            --exclude-table-data=auth.refresh_tokens --exclude-table-data=auth.sessions \
            --exclude-table-data=auth.one_time_tokens --exclude-table-data=auth.flow_state \
            --exclude-table-data=auth.mfa_challenges --exclude-table-data=auth.mfa_factors \
            "$SUPABASE_DB_URL" \
            | age --recipient "$BACKUP_AGE_PUBLIC_KEY" > "$ENCRYPTED_FILE"
          if [ "$(head -c 21 "$ENCRYPTED_FILE")" != "age-encryption.org/v1" ]; then
            echo "::error::The backup is not an age file"
            exit 1
          fi
      - name: Upload to R2 and read it back
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 takes the checksums the AWS CLI sends only where S3 requires them.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          for name in R2_ACCOUNT_ID R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the GitHub environment 'production-backup'"
              exit 1
            fi
          done
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          key="postgres/$(date -u +%Y-%m-%dT%H%MZ).dump.age"
          checksum="$(sha256sum "$ENCRYPTED_FILE" | cut -d' ' -f1)"
          aws s3 cp "$ENCRYPTED_FILE" "s3://$R2_BUCKET/$key" --endpoint-url "$endpoint" \
            --metadata "sha256=$checksum" --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/$key" "$VERIFY_FILE" --endpoint-url "$endpoint" --only-show-errors
          if [ "$(sha256sum "$VERIFY_FILE" | cut -d' ' -f1)" != "$checksum" ]; then
            echo "::error::The object in R2 differs from the backup that was uploaded"
            exit 1
          fi
          echo "Backup $key: $(stat -c %s "$ENCRYPTED_FILE") bytes, sha256 $checksum" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the local copies
        if: always()
        run: rm -f "$ENCRYPTED_FILE" "$VERIFY_FILE"
